<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --border: #e2e8f0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text: #f1f5f9;
                --text-muted: #94a3b8;
                --accent: #60a5fa;
                --border: #334155;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        .badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            font-weight: 600;
        }
        .info {
            margin-bottom: 1.5rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }
        .info-row:last-child { border-bottom: none; }
        .label { color: var(--text-muted); }
        .value { font-family: monospace; font-weight: 500; }
        .links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.9; }
        a.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ app_name }}</h1>
        <span class="badge">{{ environment }}</span>

        <div class="info">
            <div class="info-row">
                <span class="label">Version</span>
                <span class="value">{{ version }}</span>
            </div>
            <div class="info-row">
                <span class="label">Commit</span>
                <span class="value">{{ git_sha[:8] if git_sha != 'unknown' else git_sha }}</span>
            </div>
            <div class="info-row">
                <span class="label">Build Time</span>
                <span class="value">{{ build_time }}</span>
            </div>
        </div>

        <div class="links">
            <a href="/docs">API Docs</a>
            <a href="/redoc" class="secondary">ReDoc</a>
            <a href="/health/ready" class="secondary">Health</a>
        </div>
    </div>
</body>
</html>
