upstream taskflow_api {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Health check endpoint (for external load balancers)
    location /health/live {
        proxy_pass http://taskflow_api;
        proxy_read_timeout 5s;
    }

    location /health/ready {
        proxy_pass http://taskflow_api;
        proxy_read_timeout 10s;
    }

    # API and app routes
    location / {
        proxy_pass http://taskflow_api;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Metrics endpoint (restrict in production or use auth)
    location /metrics {
        proxy_pass http://taskflow_api;
        # In production, consider adding auth or IP restrictions:
        # allow 10.0.0.0/8;
        # deny all;
    }

    # Static files caching (if served by app)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://taskflow_api;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
